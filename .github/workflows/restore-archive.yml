name: Restore preserved archive
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore originals from their preserved GitHub commit
        shell: bash
        run: |
          set -euo pipefail
          git -c gc.auto=0 fetch --no-tags --depth=1 https://github.com/MatticusHTML/Aero.git 98d66c9daf2eda85dba56e4b280fa4ecbea61484
          mkdir -p archive tools
          git archive FETCH_HEAD:stick-box/archive | tar -x -C archive
          git archive FETCH_HEAD:stick-box/tools | tar -x -C tools
          python -B tools/verify_archive.py
          python -B tools/test_swf_metadata.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- archive tools
          if ! git diff --cached --quiet; then
            git -c gc.auto=0 commit -m 'Restore all 269 unchanged original animations and preservation records'
            git -c gc.auto=0 -c pack.window=0 -c pack.threads=2 push origin HEAD:main
          fi
      - name: Build site using the restored archive commit
        shell: bash
        run: python -B tools/build_site.py --media-base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$(git rev-parse HEAD)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish restored site
        id: deployment
        uses: actions/deploy-pages@v4
